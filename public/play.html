<!--
  The phone page: join the queue, see your place in line, play on your
  turn. Behavior lives in js/play.js; the games are in js/arcade.js.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PartyPlay — Join</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f7dff'/><text x='50' y='72' font-size='62' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>P</text></svg>" />
</head>
<body class="player-body">
  <div class="net-banner" id="netBanner"><span class="spin"></span><span id="netMsg">Connecting…</span></div>
  <canvas id="confetti"></canvas>

  <section id="join" class="p-wrap" style="justify-content:center; align-items:center; gap:22px;">
    <h1 class="logo" style="font-size:2.2rem;"><span class="mark">P</span>Party<span class="dot">Play</span></h1>
    <form class="join-form" id="joinForm">
      <div class="field">
        <label for="codeInput">Room code</label>
        <input class="code-input" id="codeInput" maxlength="4" autocomplete="off" autocapitalize="characters" inputmode="text" placeholder="ABCD" />
      </div>
      <div class="field">
        <label for="nameInput">Your nickname</label>
        <input id="nameInput" maxlength="14" autocomplete="off" placeholder="e.g. Rocket" />
      </div>
      <div class="err" id="joinErr"></div>
      <button type="submit" class="btn big" id="joinBtn">Join queue</button>
    </form>
  </section>

  <section id="queue" class="p-wrap hidden">
    <div class="p-head">
      <div class="me"><span class="av" id="meAv"></span><span id="meName"></span></div>
      <div class="score">#<span id="queuePos">1</span> in line</div>
    </div>
    <div class="waiting">
      <div class="av-big" id="waitAv"></div>
      <h2 id="queueTitle">You're in the queue</h2>
      <p class="tag" id="queueMsg"><span class="dots">Waiting for your turn</span></p>
      <div class="rank-pill" id="nowPlaying" style="margin-top:16px; display:none;"></div>
    </div>
  </section>

  <section id="playing" class="p-wrap hidden">
    <div class="p-head">
      <div class="me"><span class="av" id="playAv"></span><span id="playName"></span></div>
      <div class="score"><span id="playScore">0</span> pts · LIVE</div>
    </div>
    <div class="live-badge">📺 On the big screen</div>
    <div class="p-stage" id="pStage"></div>
  </section>

  <section id="spectate" class="p-wrap hidden">
    <div class="p-head">
      <div class="me"><span class="av" id="specAv"></span><span id="specName"></span></div>
      <div class="score">#<span id="specPos">2</span> in line</div>
    </div>
    <div class="waiting">
      <div class="av-big" id="specPlayAv"></div>
      <h2 id="specTitle">Watch the big screen!</h2>
      <p class="tag" id="specMsg">Someone else is playing right now</p>
    </div>
  </section>

  <section id="turnOver" class="p-wrap hidden">
    <div class="waiting">
      <div class="av-big" id="overAv"></div>
      <h2 id="overTitle">Your turn is over</h2>
      <div class="big-msg" id="overScore" style="font-size:2.4rem;"></div>
      <p class="tag" id="overMsg"></p>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/confetti.js"></script>
  <script src="/js/arcade.js"></script>
  <script src="/js/play.js"></script>
</body>
</html>
